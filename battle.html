<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101521"><title>Battle | 大塚事務所格闘録</title><link rel="stylesheet" href="css/game.css"></head><body>
<section id="game"><canvas id="arena" width="960" height="540"></canvas>
<div id="hud"><div class="hudside"><div class="name" id="pName">PLAYER</div><div class="meter"><div class="fill" id="pBar"></div></div></div><div class="hudside right"><div class="name" id="eName">CPU</div><div class="meter"><div class="fill" id="eBar"></div></div></div></div>
<div id="round">ROUND 1</div><div id="status">FIGHT!</div><div id="comboHud"></div><div id="superWrap"><div id="superFill"></div></div><div id="meterLabel">SUPER</div>
<div id="topButtons"><button class="smallBtn" id="fullscreen">全画面</button><button class="smallBtn" id="back">キャラ選択</button></div>
<div id="controls"><div id="stickZone"><div id="stickHint">MOVE　↑ JUMP / ↓ CROUCH</div><div id="stickKnob"></div></div>
<div id="buttons"><button class="action" id="btnPunch">パンチ</button><button class="action" id="btnKick">キック</button><button class="action" id="btnSpecial">必殺</button><button class="action" id="btnFocus">セービング</button></div></div>
</section>
<script src="js/fighters.js"></script><script src="js/combat.js"></script><script src="js/render.js"></script><script src="js/input.js"></script><script src="js/battle.js"></script></body></html>
