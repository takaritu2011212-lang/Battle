<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101521"><title>Fighter Select | 大塚事務所格闘録</title><link rel="stylesheet" href="css/game.css"></head><body><section id="selectPanel">
<h1>FIGHTER SELECT</h1><div class="sub">参戦者を選択。各キャラクターの固有技とコマンドを確認できる。</div>
<div id="roster"></div><aside id="moveGuide"><b>基本操作</b><span>←→ 移動 / ↑ ジャンプ / ↓ しゃがみ・下段攻撃</span><span>相手方向＋パンチ・キック：強攻撃へ派生 / ↓→+P：連環弾 / →↓→+K：突進奥義 / ←←+P：後退反撃 / ↓→+P：連環弾 / →↓→+K：突進奥義 / ←←+P：後退反撃</span><span>背中方向入力：ガード / 空中攻撃：上段 / 立ち：中段 / しゃがみ：下段</span><div id="selectedMoves"></div></aside><button id="start">対戦開始</button>
</section>
<section id="game" class="hidden">
<canvas id="arena" width="960" height="540"></canvas>
<div id="hud"><div class="hudside"><div class="name" id="pName">PLAYER</div><div class="meter"><div class="fill" id="pBar"></div></div></div><div class="hudside right"><div class="name" id="eName">CPU</div><div class="meter"><div class="fill" id="eBar"></div></div></div></div>
<div id="round">ROUND 1</div><div id="status">FIGHT!</div><div id="comboHud"></div><div id="superWrap"><div id="superFill"></div></div><div id="meterLabel">SUPER</div>
<div id="topButtons"><button class="smallBtn" id="fullscreen">全画面</button><button class="smallBtn" id="back">キャラ選択</button></div>
<div id="controls">
<div id="stickZone"><div id="stickHint">MOVE　↑ JUMP / ↓ CROUCH</div><div id="stickKnob"></div></div>
<div id="buttons"><button class="action" id="btnPunch">パンチ</button><button class="action" id="btnKick">キック</button><button class="action" id="btnSpecial">必殺</button><button class="action" id="btnFocus">セービング</button></div>
</div>
<div id="endPanel" class="hidden"><div id="endCard"><h2 id="resultText">WIN!</h2><button id="rematch" class="smallBtn">もう一度対戦</button><button id="toSelect" class="smallBtn">キャラ選択</button></div></div>
</section><script src="js/fighters.js"></script><script src="js/combat.js"></script><script src="js/render.js"></script><script src="js/input.js"></script><script src="js/main.js"></script></body></html>
