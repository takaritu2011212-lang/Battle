<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大塚事務所格闘録</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101521;color:#edf2ff;font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:manipulation}.wrap{max-width:900px;margin:auto;padding:12px}h1{font-size:clamp(21px,5vw,30px);margin:5px 0}.muted{color:#aab6cf;font-size:12px}.panel{background:#1b2638;border:1px solid #35445f;border-radius:12px;padding:12px;margin:12px 0}#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.fighter{background:#26354b;border:1px solid #435775;color:white;border-radius:9px;padding:8px;text-align:left}.fighter.selected{outline:3px solid #f4c66a}.fighter canvas{width:100%;height:65px;background:#e8e3d5;image-rendering:pixelated}.fighter b,.fighter small{display:block}.fighter small{color:#c1cce0}button{border:0;border-radius:8px;padding:11px;background:#e4b85e;color:#20202a;font-weight:800}.hidden{display:none}#arena{width:100%;height:auto;display:block;background:#d8d2c2;border:3px solid #f1e8d2;border-radius:8px;image-rendering:pixelated;touch-action:none}.hud{display:flex;justify-content:space-between;gap:12px}.hud>div{width:50%}.bar{height:14px;background:#512e3b;border:1px solid #fff5}.fill{height:100%;width:100%;background:#63c77a}#status{text-align:center;min-height:25px;color:#f4d48c;font-weight:bold;margin:8px}.mobile{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;user-select:none}.stick-area{display:grid;justify-items:center;gap:4px;color:#aab6cf;font-size:11px}.stick{width:112px;height:112px;border-radius:50%;background:#33445d;border:2px solid #8090a8;position:relative;touch-action:none}.knob{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:#d6b66f;border:2px solid #fff8;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(2,minmax(65px,1fr));gap:7px;max-width:230px;flex:1}.pad button{min-height:54px;padding:6px 3px;touch-action:none}.secondary{background:#455873;color:white;margin-top:10px}.note{font-size:12px;color:#aab6cf;line-height:1.5}@media(min-width:700px){.mobile{max-width:420px;margin:14px auto 0}}@media(max-width:360px){.stick{width:98px;height:98px}.knob{left:25px;top:25px;width:44px;height:44px}.pad button{font-size:11px}}
</style>
</head>
<body><main class="wrap">
<h1>大塚事務所格闘録</h1><div class="muted">PIXEL FIGHTER / 試作版 0.2　CPU対戦・タッチ操作対応</div>
<section id="selectPanel" class="panel"><h2>使用キャラクターを選択</h2><div id="roster"></div><p class="note">相手は残りのメンバーからランダムで選ばれます。能力は格闘ゲーム用の試作性能です。</p><button id="start">このキャラクターで対戦開始</button></section>
<section id="gamePanel" class="panel hidden"><div class="hud"><div><b id="pName">PLAYER</b><div class="bar"><div id="pBar" class="fill"></div></div></div><div style="text-align:right"><b id="eName">CPU</b><div class="bar"><div id="eBar" class="fill"></div></div></div></div>
<canvas id="arena" width="480" height="270"></canvas><div id="status">ROUND 1　FIGHT!</div>
<div class="mobile"><div class="stick-area"><div id="stick" class="stick"><div id="knob" class="knob"></div></div>移動スティック</div><div class="pad"><button id="jump">ジャンプ</button><button id="weak">弱攻撃</button><button id="strong">強攻撃</button><button id="special">特殊技</button></div></div>
<button id="back" class="secondary">キャラ選択へ戻る</button><p class="note">キーボード：A/D 移動、W ジャンプ、J 弱攻撃、K 強攻撃、L 特殊技。</p></section>
</main>
<script>
const cast=[
{name:"大塚蒼生",role:"万能・アーティファクト",color:"#35465f",hair:"#20232d",skill:"時空の一閃"},
{name:"羽神ミナ",role:"技巧・鎖",color:"#513e60",hair:"#292333",skill:"死奥の鎖"},
{name:"住吉",role:"迎撃・カウンター",color:"#52606a",hair:"#20252b",skill:"合理的迎撃"},
{name:"山中和也",role:"重量・パワー",color:"#694747",hair:"#28252a",skill:"破鏡"},
{name:"私和",role:"高速・回避",color:"#42615b",hair:"#222b2b",skill:"瞬動"},
{name:"定峰",role:"回避・攪乱",color:"#53628a",hair:"#282b39",skill:"幻歩"},
{name:"漆原",role:"経験・戦術",color:"#6a6046",hair:"#28251e",skill:"見切り"}
];
const $=id=>document.getElementById(id), canvas=$("arena"),ctx=canvas.getContext("2d");
let selected=0,player=null,cpu=null,running=false,last=0,keys={},stickId=null;
function sprite(c,x,y,dir,pose=0){c.save();c.translate(x,y);c.scale(dir,1);let leg=pose?4:0;const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};r(-12,0,24,3,"#999");r(-8,-17+leg,6,17-leg,"#29364c");r(2,-17-leg,6,17+leg,"#29364c");r(-10,-43,20,27,c.body);r(-13,-41,5,20,c.body);r(8,-41,5,20,c.body);r(-9,-65,18,17,"#e7b995");r(-10,-66,20,7,c.hair);r(-11,-61,5,10,c.hair);r(6,-62,5,8,c.hair);r(3,-57,2,2,"#25232a");c.restore()}
function drawThumb(canvasEl,data){let c=canvasEl.getContext("2d");c.fillStyle="#e8e3d5";c.fillRect(0,0,120,70);sprite(c,60,65,1,0);c.save();c.translate(60,0);c.restore();/* palette is applied in arena renderer */c.fillStyle=data.color;c.fillRect(52,27,16,24);c.fillStyle=data.hair;c.fillRect(51,8,18,7)}
cast.forEach((data,i)=>{let b=document.createElement("button");b.className="fighter"+(i===0?" selected":"");let cv=document.createElement("canvas");cv.width=120;cv.height=70;drawThumb(cv,data);b.append(cv);let name=document.createElement("b");name.textContent=data.name;b.append(name);let role=document.createElement("small");role.textContent=data.role;b.append(role);b.onclick=()=>{selected=i;document.querySelectorAll(".fighter").forEach((el,j)=>el.classList.toggle("selected",i===j))};$("roster").append(b)});
function makeFighter(data,x,dir,isCPU){return{data,x,y:218,dir,hp:100,vy:0,ground:true,cool:0,stun:0,act:0,actTime:0,bleed:0,ai:0,isCPU,pose:0}}
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function status(s){$("status").textContent=s}
function start(){let i;do{i=Math.floor(Math.random()*cast.length)}while(i===selected);player=makeFighter(cast[selected],115,1,false);cpu=makeFighter(cast[i],365,-1,true);$("pName").textContent=player.data.name;$("eName").textContent=cpu.data.name+"（CPU）";$("selectPanel").classList.add("hidden");$("gamePanel").classList.remove("hidden");running=true;last=0;status("ROUND 1　FIGHT!");requestAnimationFrame(loop)}
function attack(f,t,type){if(!running||f.cool>0||f.stun>0||f.actTime>0)return;let cfg=type==="weak"?{d:7,r:48,time:17,c:24,s:10}:type==="strong"?{d:13,r:58,time:28,c:42,s:17}:{d:f.data.name==="山中和也"?18:12,r:75,time:34,c:65,s:22};f.act=type;f.actTime=cfg.time;f.cool=cfg.c;if(Math.abs(f.x-t.x)<cfg.r&&Math.abs(f.y-t.y)<48&&f.dir===(t.x>f.x?1:-1)){t.hp=Math.max(0,t.hp-cfg.d);t.stun=cfg.s;t.x=clamp(t.x+f.dir*14,25,455);if(f.data.name==="山中和也"&&type==="special")t.bleed=150;status(f.data.name+"："+(type==="special"?f.data.skill:type==="strong"?"強攻撃":"弱攻撃")+"！");if(t.hp<=0){running=false;status(f.data.name+" WIN!")}}}
function update(f,other,dt){f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.actTime=Math.max(0,f.actTime-dt);if(f.bleed>0){let before=Math.ceil(f.bleed/50);f.bleed=Math.max(0,f.bleed-dt);if(Math.ceil(f.bleed/50)<before)f.hp=Math.max(0,f.hp-1)}if(f.isCPU){f.ai+=dt;let d=Math.abs(other.x-f.x);f.dir=other.x>f.x?1:-1;if(f.stun<=0&&f.actTime<=0){if(d>58){f.x+=f.dir*(f.data.name==="私和"?1.8:1.15)*dt/16;f.pose=1}else if(f.ai>430){f.ai=0;let r=Math.random();attack(f,other,r<.42?"weak":r<.78?"strong":"special")}else f.pose=0}}else if(f.stun<=0&&f.actTime<=0){let m=(keys.a?-1:0)+(keys.d?1:0);f.x+=m*(f.data.name==="私和"?2.2:1.6)*dt/16;f.pose=m?1:0;f.dir=other.x>f.x?1:-1;if(keys.w&&f.ground){f.vy=-6.2;f.ground=false}}if(!f.ground){f.y+=f.vy*dt/16;f.vy+=.32*dt/16;if(f.y>=218){f.y=218;f.vy=0;f.ground=true}}f.x=clamp(f.x,28,452)}
function render(){ctx.clearRect(0,0,480,270);ctx.fillStyle="#d8d2c2";ctx.fillRect(0,0,480,270);ctx.fillStyle="#b8b4a9";for(let i=0;i<8;i++){let x=i*68;ctx.fillRect(x,105+(i%3)*15,48,110)}ctx.fillStyle="#8f9787";ctx.fillRect(0,220,480,50);ctx.fillStyle="#414b53";ctx.fillRect(172,28,136,25);ctx.fillStyle="#f5e8c8";ctx.font="bold 11px monospace";ctx.textAlign="center";ctx.fillText("OTSUKA OFFICE",240,45);[player,cpu].forEach(f=>{ctx.fillStyle="#777";ctx.fillRect(f.x-13,220,26,3);sprite(ctx,f.x,f.y,f.dir,f.actTime>0?1:f.pose);ctx.fillStyle=f.data.color;ctx.fillRect(f.x-9,f.y-43,18,27);ctx.fillStyle=f.data.hair;ctx.fillRect(f.x-10,f.y-66,20,7);if(f.actTime>0){ctx.fillStyle=f.act==="special"?"#e6bd61":"#fff2d0";ctx.fillRect(f.x+f.dir*15-(f.dir<0?28:0),f.y-52,28,4)}});$("pBar").style.width=player.hp+"%";$("eBar").style.width=cpu.hp+"%"}
function loop(t){if(!running){render();return}let dt=Math.min(32,t-(last||t));last=t;update(player,cpu,dt);update(cpu,player,dt);if(player.hp<=0){running=false;status(cpu.data.name+" WIN!")}render();if(running)requestAnimationFrame(loop)}
$("start").onclick=start;$("back").onclick=()=>{running=false;$("gamePanel").classList.add("hidden");$("selectPanel").classList.remove("hidden")};
document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();keys[k]=true;if(e.repeat)return;if(k==="j"&&player)attack(player,cpu,"weak");if(k==="k"&&player)attack(player,cpu,"strong");if(k==="l"&&player)attack(player,cpu,"special")});document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const stick=$("stick"),knob=$("knob");function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.31,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform="translate("+dx+"px,"+dy+"px)";keys.a=dx< -12;keys.d=dx>12}
stick.addEventListener("pointerdown",e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener("pointermove",e=>{if(e.pointerId===stickId)moveStick(e)});function release(e){if(e.pointerId!==stickId)return;stickId=null;keys.a=keys.d=false;knob.style.transform="translate(0,0)"}stick.addEventListener("pointerup",release);stick.addEventListener("pointercancel",release);
function hold(id,key){let b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
hold("jump","w");$("weak").onclick=()=>player&&attack(player,cpu,"weak");$("strong").onclick=()=>player&&attack(player,cpu,"strong");$("special").onclick=()=>player&&attack(player,cpu,"special");
</script></body></html>
