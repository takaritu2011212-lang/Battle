<section id="selectPanel">
<h1>大塚事務所格闘録</h1><div class="sub">PIXEL FIGHTER / BUILD 0.5　横画面・タッチ操作対応</div>

cast.forEach((d,i)=>{let b=document.createElement("button");b.className="fighter"+(i===0?" selected":"");let cv=document.createElement("canvas");cv.width=130;cv.height=60;cv.style.width="100%";cv.style.height="60px";cv.style.imageRendering="pixelated";drawMini(cv,d);let n=document.createElement("b");n.textContent=d.name;let r=document.createElement("small");r.textContent=d.role;let s=document.createElement("div");s.className="stats";s.textContent="HP "+d.hp+" / SPEED "+d.speed+" / "+d.special+"\n連係: "+d.routes.join("・");b.append(cv,n,r,s);b.onclick=()=>{selected=i;document.querySelectorAll(".fighter").forEach((x,j)=>x.classList.toggle("selected",i===j))};$("roster").append(b)});

function attackButton(f,t,code){
 const map={LP:["weak",1],MP:["medium",1.28],HP:["heavy",1.65],LK:["weak",.9],MK:["medium",1.12],HK:["heavy",1.48]},m=map[code];
 if(!running||!m||f.stun>0||(!f.ground&&f.airAttackUsed))return;
 const chained=f.comboWindow>0&&f.attackTime<120;if((f.attackTime>0||f.cool>0)&&!chained)return;
 const now=performance.now();f.comboBuffer=f.comboBuffer.filter(v=>now-v.t<1100);f.comboBuffer.push({code,t:now});if(f.comboBuffer.length>3)f.comboBuffer.shift();

 const rank=m[0],base=rank==="weak"?f.d.weak:rank==="medium"?Math.round(f.d.weak*1.35):f.d.strong;
 const damage=Math.max(1,Math.round(base*m[1]*(chained ? 0.9 : 1)*(f.ground ? 1 : 0.82)*(routeHit?1.3:1)));
 const reach=f.d.reach*(rank==="weak"?.92:rank==="medium"?1.04:1.13);
 f.attackKind=code;f.attackTime=rank==="weak"?175:rank==="medium"?230:300;f.cool=rank==="weak"?280:rank==="medium"?430:610;f.comboWindow=rank==="heavy"?0:660;f.moveState="attack";f.moveTimer=f.attackTime;
 if(!f.ground)f.airAttackUsed=true;

function meleeEffect(f,t,dmg,range,label){if(Math.abs(t.x-f.x)<=range&&f.dir===(t.x>f.x?1:-1)){dmg=Math.round(dmg*(f.attackKind==="super"?1.8:1));if(t.focus>0){t.focus=0;dmg=Math.max(1,Math.ceil(dmg*.4));t.stun=0}else t.stun=230;t.hp=Math.max(0,t.hp-dmg);t.stun=t.focus>0?0:230;t.flash=140;t.x=clamp(t.x+f.dir*20,45,915);say(f.d.name+"："+label+"！");checkWin()}else say(f.d.name+"："+label+"！")}

function updateShots(dt){
