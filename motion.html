<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101521">
<title>Motion Showcase | 大塚事務所格闘録</title>
<link rel="stylesheet" href="css/motion.css">
</head>
<body>
<main class="shell">
<header class="header">
  <div class="brand"><div class="emblem">B</div><div><div class="kicker">OTSUKA OFFICE / FIGHTING PROJECT</div><h1>MOTION SHOWCASE</h1></div></div>
  <div class="headnote">CHARACTER ANIMATION STUDY<br>CANVAS RENDER / 60 FPS TARGET</div>
</header>
<section class="stage">
  <canvas id="motionView" width="960" height="540" aria-label="大塚蒼生のアニメーション"></canvas>
  <div class="hud"><div class="hudTag">TRAINING STAGE <b>01</b></div><div class="hudTag">MOTION SYSTEM <b>LIVE</b></div></div>
  <div class="stageCaption"><div class="fighterName"><small>FIGHTER / NO. 01</small>大塚 蒼生</div><div class="motionState" id="motionName">待機 / IDLE</div></div>
</section>
<section class="panel">
  <div class="panelHead"><strong>ANIMATION SELECT</strong><span>動作を選択してモーションをループ再生</span></div>
  <div class="motionGrid">
    <button class="motionButton active" data-motion="idle"><b>待機</b><small>IDLE</small></button>
    <button class="motionButton" data-motion="walk"><b>歩行</b><small>WALK</small></button>
    <button class="motionButton" data-motion="run"><b>走行</b><small>RUN</small></button>
    <button class="motionButton" data-motion="jump"><b>ジャンプ</b><small>JUMP</small></button>
    <button class="motionButton" data-motion="crouch"><b>しゃがみ</b><small>CROUCH</small></button>
    <button class="motionButton" data-motion="punch"><b>パンチ</b><small>PUNCH</small></button>
    <button class="motionButton" data-motion="kick"><b>キック</b><small>KICK</small></button>
    <button class="motionButton" data-motion="special"><b>必殺技</b><small>SPECIAL</small></button>
    <button class="motionButton" data-motion="guard"><b>ガード</b><small>GUARD</small></button>
    <button class="motionButton" data-motion="hit"><b>被弾</b><small>DAMAGE</small></button>
  </div>
  <div class="toolbar">
    <button class="tool strong" id="play">Ⅱ 停止</button>
    <button class="tool" id="auto">自動デモ</button>
    <label class="speed">再生速度 <input id="speed" type="range" min=".5" max="1.8" step=".1" value="1"><b id="speedValue">1.0×</b></label>
    <label class="speed">背景効果 <input id="effects" type="checkbox" checked></label>
    <span class="readout" id="frameReadout">FRAME 00 / LOOP</span>
  </div>
  <div class="progress"><div id="progressFill"></div></div>
</section>
<footer class="footer"><span>これは独立した演出確認用デモです。対戦本体の処理・データには干渉しません。</span><span>RETURN TO <a href="index.html" style="color:#8fdcf1">TITLE</a></span></footer>
</main>
<script src="js/motion.js"></script>
</body>
</html>
